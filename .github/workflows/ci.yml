name: LunaEngine CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONWARNINGS: default

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install native audio libraries
        run: sudo apt-get update && sudo apt-get install -y libopenal1 libopenal-dev

      - name: Install package and development dependencies
        run: |
          # The editable install reads dependencies from pyproject.toml.
          # requirements.txt is kept aligned for direct/manual installs.
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Show runtime versions
        run: |
          python --version
          python -m pip show numpy pygame pytest PyOpenGL PyOpenAL psutil

      - name: Compile all Python modules
        run: python -m compileall -q lunaengine tests

      - name: Run regression tests
        run: python -m pytest -ra --tb=long -vv

      - name: Import smoke test
        run: |
          python -c "import lunaengine; print('LunaEngine import: OK')"

  package:
    name: Build release package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: lunaengine-${{ github.ref_name }}-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Build documentation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native audio libraries
        run: sudo apt-get update && sudo apt-get install -y libopenal1 libopenal-dev

      - name: Install package and documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Generate documentation website
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python lunaengine/tools/clear_pycache.py
          python lunaengine/tools/code_stats.py --json --output docs/code_stats.json
          python generate_docs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-docs:
    name: Publish documentation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
