[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunaengine"
version = "0.2.6.2"
description = "A modern 2D game framework with advanced UI and graphics"
authors = [
    {name = "MrJuaum"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["game", "engine", "2d", "graphics", "pygame", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
        "pygame>=2.6.1",
        "numpy>=2.4.6",
        "PyOpenGL>=3.1.10",
        "PyOpenGL-accelerate>=3.1.10",
        "PyOpenAL",
        "psutil"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1"
]

[project.urls]
Homepage = "https://mrjuaumbr.github.io/LunaEngine/"
Repository = "https://github.com/MrJuaumBR/LunaEngine"
"Issue Tracker" = "https://github.com/MrJuaumBR/LunaEngine/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # Look in current directory
include = ["lunaengine*"]  # Include lunaengine and its subpackages
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
"lunaengine" = ["**/*.json", "**/*.txt", "**/*.md", "**/*.glsl", "**/*.frag", "**/*.vert"]
